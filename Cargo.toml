[package]
authors = [
  "Andrew Wheeler <genusistimelord@outlook.com>",
  "Sherwin Salonga",
  "S.J.R. van Schaik",
]
edition = "2024"
license = "MIT OR Apache-2.0"
name = "client"
version = "0.2.0"

[dependencies]
ahash = "0.8.12"
arboard = "3.6.1"
ascending_camera = "0.9.0"
ascending_graphics = {version = "0.46.0", features = ["static_dx", "rayon"]}
ascending_input = "0.6.2"
ascending_time = {version = "0.5.0", features = ["enable_serde", "enable_mmap_bytey", "enable_bytey"]}
backtrace = "0.3.76"
bit_op = "0.1.1"
bytey = "0.4.0"
educe = {version = "0.7.6", default-features = false, features = [
  "Debug",
  "PartialEq",
  "Default",
]}
futures = "0.3.34"
image = "0.25.10"
indexmap = "2.14.0"
log = {version = "0.4.33", default-features = false}
lru = "0.18.2"
mio = {version = "1.2.2", features = ["os-poll", "net"]}
mmap_bytey = "0.3.0"
pki-types = {package = "rustls-pki-types", version = "1.15.1", features = [
  "std",
]}
rand = "0.10.2"
rcgen = {version = "0.14.9", features = [
  "pem",
  "ring",
], default-features = false}
regex = "1.13.1"
rodio = "0.22.2"
rustls = {version = "0.23.43", default-features = false, features = [
  "logging",
  "ring",
  "std",
  "tls12",
]}
serde = {version = "1.0.229", features = ["derive"]}
serde_json = "1.0.151"
slab = "0.4.12"
slotmap = "1.1.1"
snafu = {version = "0.9.2", features = [
  "backtraces-impl-backtrace-crate",
  "rust_1_81",
]}
speedy = "0.8.7"
thiserror = "2.0.20"
tokio = {version = "1.53.1", features = ["full"]}
toml = "1.1.4+spec-1.1.0"
uuid = {version = "1.24.0", features = [
  "v7", # Lets you generate random UUIDs
  "fast-rng", # Use a faster (but still sufficiently random) RNG
  "macro-diagnostics", # Enable better diagnostics for compile-time UUIDs
]}
webpki = "0.22.4"
webpki-roots = "1.0.9"
winit = {version = "0.30.13", features = ["serde", "rwh_05"]}

[profile.dev]
codegen-units = 256
debug = true
debug-assertions = true
incremental = true
lto = false
opt-level = 0
overflow-checks = true
panic = 'unwind'
rpath = false
strip = "none"

[profile.release]
codegen-units = 256
debug = false
debug-assertions = false
incremental = true
lto = true
opt-level = 3
overflow-checks = true
panic = 'unwind'
rpath = false
strip = "none"

[profile.dev.package."*"]
opt-level = 2
